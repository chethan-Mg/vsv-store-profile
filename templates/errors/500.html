{% extends 'base.html' %}
{% block title %}Server Error - VSV Store{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
        <h1 class="display-4 fw-bold text-warning">500</h1>
        <h3 class="mb-3">Something Went Wrong</h3>
        <p class="text-muted mb-4">We're sorry, an internal error occurred. Please try again later.</p>
        <a href="{{ url_for('home') }}" class="btn btn-success btn-lg">
            <i class="fas fa-home me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
