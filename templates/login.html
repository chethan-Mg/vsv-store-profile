{% extends "base.html" %}

{% block title %}Login - VSV Store{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .auth-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        max-width: 450px;
        width: 100%;
    }

    .auth-header {
        background: linear-gradient(135deg, var(--vsv-primary), var(--vsv-secondary));
        color: #fff;
        padding: 2rem;
        text-align: center;
    }

    .auth-header i {
        font-size: 3rem;
        margin-bottom: 0.8rem;
        color: var(--vsv-accent);
    }

    .auth-header h3 {
        font-weight: 700;
        margin-bottom: 0.3rem;
    }

    .auth-body {
        padding: 2rem;
    }

    .auth-body .form-label {
        font-weight: 500;
        color: #555;
        font-size: 0.9rem;
    }

    .auth-body .form-control {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 0.7rem 1rem;
        transition: border-color 0.2s ease;
    }

    .auth-body .form-control:focus {
        border-color: var(--vsv-accent);
        box-shadow: 0 0 0 0.2rem rgba(45, 106, 79, 0.1);
    }

    .auth-body .input-group-text {
        background: var(--vsv-light-green);
        border: 2px solid #e9ecef;
        border-right: none;
        border-radius: 10px 0 0 10px;
        color: var(--vsv-primary);
    }

    .auth-body .input-group .form-control {
        border-left: none;
        border-radius: 0 10px 10px 0;
    }

    .auth-footer {
        text-align: center;
        padding: 1rem 2rem 2rem;
    }

    .auth-footer a {
        color: var(--vsv-primary);
        font-weight: 500;
        text-decoration: none;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-leaf"></i>
            <h3>Welcome Back</h3>
            <p class="mb-0 small opacity-75">Sign in to your VSV Store account</p>
        </div>

        <div class="auth-body">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Email or Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter email or username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-vsv w-100 btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </form>
        </div>

        <div class="auth-footer">
            <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
